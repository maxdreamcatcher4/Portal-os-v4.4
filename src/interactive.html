<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Portal‑OS Interactive</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 800px; }
    textarea { width: 100%; height: 120px; }
    pre { background:#f6f8fa; padding:10px; overflow:auto; }
    button { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Portal‑OS Interactive</h1>
  <p>Call the Umbrella endpoints and the Substrate store.</p>

  <h2>Call /api/substrate</h2>
  <textarea id="payload">{"hello":"portal"}</textarea>
  <br/>
  <button id="post">POST to /api/substrate</button>
  <button id="get">GET /api/substrate</button>

  <h2>Result</h2>
  <pre id="result">No request yet</pre>

  <script>
    const result = document.getElementById('result');
    document.getElementById('post').onclick = async () => {
      const payload = document.getElementById('payload').value;
      try {
        const res = await fetch('/api/substrate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: payload });
        result.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) { result.textContent = String(e); }
    };
    document.getElementById('get').onclick = async () => {
      try {
        const res = await fetch('/api/substrate');
        result.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) { result.textContent = String(e); }
    };
  </script>
</body>
</html>
