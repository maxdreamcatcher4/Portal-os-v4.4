name = \"portal-os-v1\"\nmain = \"src/worker.ts\"\ncompatibility_date = \"2024-07-01\"\ncompatibility_flags = [\"nodejs_compat\"]\n\n# KV namespace binding\n[[kv_namespaces]]\nbinding = \"SUBSTRATE_KV\"\nid = \"replace_with_kv_namespace_id\"\npreview_id = \"replace_with_kv_namespace_preview_id\"\n\n# Durable Object binding\n[[durable_objects.bindings]]\nname = \"SUBSTRATE_DO\"\nclass_name = \"SubstrateDO\"\nscript_name = \"portal-os-v1\"\n\n# Durable Objects migration\n[[migrations]]\ntag = \"v1\"\nnew_classes = [\"SubstrateDO\"]\n\n# Environment configurations\n[env.development]\nname = \"portal-os-v1-dev\"\nvars = { ENVIRONMENT = \"development\" }\n\n[env.production]\nname = \"portal-os-v1-prod\"\nvars = { ENVIRONMENT = \"production\" }\n\n# Build configuration\n[build]\ncommand = \"npm run build\"\ncwd = \".\"\nwatch_paths = [\"src/**/*.ts\"]\n\n# Build watch configuration\n[build.upload]\nformat = \"service-worker\"\n