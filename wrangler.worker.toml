name = "portal-os-v1"
compatibility_date = "2024-07-01"

[build]
command = "npm run build"

[worker]
main = "dist/worker.js"

# KV namespace binding (create via wrangler and paste the id)
[[kv_namespaces]]
binding = "SUBSTRATE_KV"
id = "<REPLACE_WITH_KV_NAMESPACE_ID>"

# Durable Object binding
[durable_objects]
bindings = [
  { name = "SUBSTRATE_DO", class_name = "SubstrateDO" }
]

# Durable Object migrations (required/strongly-recommended)
[[migrations]]
tag = "v1"
new_classes = [ "SubstrateDO" ]

# Optional environment-specific override for production
[env.production]
name = "portal-os-v1-prod"

# Repeat KV and Durable Object bindings under the environment if your production
# deployment requires different IDs.
[[env.production.kv_namespaces]]
binding = "SUBSTRATE_KV"
id = "<REPLACE_WITH_KV_NAMESPACE_ID>"

[env.production.durable_objects]
bindings = [
  { name = "SUBSTRATE_DO", class_name = "SubstrateDO" }
]
