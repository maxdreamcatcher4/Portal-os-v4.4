name = "portal-os-v1"
compatibility_date = "2024-07-01"

[build]
command = "npm run build"

[worker]
main = "dist/worker.js"

# KV namespace binding (create via wrangler and paste the id)
[[kv_namespaces]]
binding = "SUBSTRATE_KV"
id = "807456cb41558d3c820308b20affa851"

# Additional runtime KV namespace
[[kv_namespaces]]
binding = "RUNTIME_KV"
id = "yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"

# Durable Object binding
[durable_objects]
bindings = [
  { name = "SUBSTRATE_DO", class_name = "SubstrateDO" }
]

# Durable Object migrations (required/strongly-recommended)
[[migrations]]
tag = "v1"
new_classes = [ "SubstrateDO" ]

# Optional environment-specific override for production
[env.production]
name = "portal-os-v1-prod"

# Production KV namespaces (same as default here)
[[env.production.kv_namespaces]]
binding = "SUBSTRATE_KV"
id = "807456cb41558d3c820308b20affa851"

[[env.production.kv_namespaces]]
binding = "RUNTIME_KV"
id = "yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"

[env.production.durable_objects]
bindings = [
  { name = "SUBSTRATE_DO", class_name = "SubstrateDO" }
]
