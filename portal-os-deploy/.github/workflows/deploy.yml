name: Deploy Portal-OS to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: portal-os-deploy

      - name: Build
        run: npm run build
        working-directory: portal-os-deploy

      - name: Deploy to Cloudflare
        run: npm run deploy
        working-directory: portal-os-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
